<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Computing Lab — Video Streaming</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1111;
      color: #ffffff;
      text-align: center;
    }
    main {
      max-width: 960px;
      margin: 48px auto;
      padding: 0 16px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000000;
    }
    p {
      color: #aab7b8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Video Streaming with S3 + CloudFront</h1>
    <!-- Change sample.mp4 to the name of the video you uploaded -->
    <video src="sample.mp4" controls preload="metadata"></video>
    <p>Stored privately in Amazon S3, delivered through the Amazon CloudFront CDN.</p>
  </main>
</body>
</html>
